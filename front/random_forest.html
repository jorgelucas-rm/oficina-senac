<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis - Random Forest</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 20px;
            position: relative;
        }

        .examples-sidebar {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 300px;
            max-height: 80vh;
            overflow-y: auto;
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
        }

        .examples-sidebar h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
        }

        .example-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .example-card:hover {
            border-color: #11998e;
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.2);
        }

        .example-label {
            font-size: 12px;
            font-weight: 600;
            color: #11998e;
            text-transform: capitalize;
            margin-bottom: 5px;
        }

        .example-text {
            font-size: 13px;
            color: #555;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        @media (max-width: 1024px) {
            .examples-sidebar {
                position: relative;
                left: auto;
                top: auto;
                transform: none;
                width: 100%;
                max-height: 300px;
                margin-bottom: 20px;
            }
            
            body {
                flex-direction: column;
            }
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #11998e;
            box-shadow: 0 0 0 3px rgba(17, 153, 142, 0.1);
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border-radius: 12px;
            color: white;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .result.show {
            display: block;
        }

        .sentiment {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .confidence {
            font-size: 16px;
            opacity: 0.9;
        }

        .probabilities {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .prob-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .prob-bar {
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
        }

        .prob-fill {
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        .loading {
            text-align: center;
            color: #666;
            margin-top: 20px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hint {
            color: #999;
            font-size: 12px;
            margin-top: 8px;
        }

        .model-info {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #666;
        }

        .model-info strong {
            color: #11998e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌳 Análise de Sentimentos <span class="badge">Random Forest</span></h1>
        <p class="subtitle">Powered by JavaScript + Random Forest Classifier</p>
        
        <div class="model-info" id="modelInfo">
            <strong>Carregando modelo...</strong>
        </div>

        <div class="input-group">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="textInput" 
                    placeholder="Digite um texto para analisar..."
                    autocomplete="off"
                >
                <button id="analyzeBtn">Analisar</button>
            </div>
            <p class="hint">Pressione Enter ou clique em Analisar</p>
        </div>

        <div class="loading" id="loading">
            Carregando modelo...
        </div>

        <div class="result" id="result">
            <div class="sentiment" id="sentiment"></div>
            <div class="confidence" id="confidence"></div>
            <div class="probabilities" id="probabilities"></div>
        </div>
    </div>

    <div class="examples-sidebar" id="examplesSidebar">
        <h2>📝 Exemplos</h2>
        <div id="examplesContainer"></div>
    </div>

    <script>
        let model = null;
        
        // Exemplos embutidos diretamente no código
        const examples = [
            {
                "id": 1,
                "content": "Péssimo atendimento! Esperei mais de 2 horas e meu pedido chegou frio e errado. O suporte não resolveu nada, só me ofereceram um cupom ridículo. Nunca mais uso esse serviço!",
                "true_sentiment": "negative",
                "predicted_sentiment": "negative",
                "confidence": {
                    "negative": 0.92,
                    "neutral": 0.05,
                    "positive": 0.03
                },
                "correct": true
            },
            {
                "id": 2,
                "content": "Horrível! O aplicativo travou três vezes durante o pagamento e ainda me cobraram duplicado. Tentei contato mas ninguém resolve. Decepcionante!",
                "true_sentiment": "negative",
                "predicted_sentiment": "negative",
                "confidence": {
                    "negative": 0.88,
                    "neutral": 0.08,
                    "positive": 0.04
                },
                "correct": true
            },
            {
                "id": 3,
                "content": "Propaganda enganosa! Os preços no app são absurdos comparados ao restaurante. As taxas aumentaram demais e a qualidade caiu muito. Não recomendo!",
                "true_sentiment": "negative",
                "predicted_sentiment": "negative",
                "confidence": {
                    "negative": 0.85,
                    "neutral": 0.10,
                    "positive": 0.05
                },
                "correct": true
            },
            {
                "id": 4,
                "content": "O aplicativo funciona bem na maioria das vezes. Tem algumas falhas ocasionais, mas nada que impeça o uso. Poderia melhorar a interface.",
                "true_sentiment": "neutral",
                "predicted_sentiment": "neutral",
                "confidence": {
                    "negative": 0.15,
                    "neutral": 0.75,
                    "positive": 0.10
                },
                "correct": true
            },
            {
                "id": 5,
                "content": "É um app normal, tem seus prós e contras. As vezes demora um pouco, mas outras vezes chega rápido. Nada excepcional, mas atende o básico.",
                "true_sentiment": "neutral",
                "predicted_sentiment": "neutral",
                "confidence": {
                    "negative": 0.12,
                    "neutral": 0.80,
                    "positive": 0.08
                },
                "correct": true
            },
            {
                "id": 6,
                "content": "Achei o serviço razoável. Tem bastante opções de restaurantes, mas os preços são um pouco altos. A entrega é dentro do esperado, nada de mais.",
                "true_sentiment": "neutral",
                "predicted_sentiment": "neutral",
                "confidence": {
                    "negative": 0.10,
                    "neutral": 0.78,
                    "positive": 0.12
                },
                "correct": true
            },
            {
                "id": 7,
                "content": "Adorei o serviço! Entrega super rápida, comida chegou quentinha e deliciosa. O aplicativo é muito fácil de usar e os cupons de desconto são ótimos. Recomendo!",
                "true_sentiment": "positive",
                "predicted_sentiment": "positive",
                "confidence": {
                    "negative": 0.04,
                    "neutral": 0.08,
                    "positive": 0.88
                },
                "correct": true
            },
            {
                "id": 8,
                "content": "Excelente experiência! O entregador foi super educado, o pedido veio completo e bem embalado. A variedade de restaurantes é incrível. Muito satisfeito!",
                "true_sentiment": "positive",
                "predicted_sentiment": "positive",
                "confidence": {
                    "negative": 0.03,
                    "neutral": 0.07,
                    "positive": 0.90
                },
                "correct": true
            },
            {
                "id": 9,
                "content": "Simplesmente perfeito! O app é intuitivo, as promoções são maravilhosas e sempre tenho uma ótima experiência. O melhor aplicativo de delivery que já usei!",
                "true_sentiment": "positive",
                "predicted_sentiment": "positive",
                "confidence": {
                    "negative": 0.02,
                    "neutral": 0.05,
                    "positive": 0.93
                },
                "correct": true
            },
            {
                "id": 10,
                "content": "Estou muito feliz com o serviço! Pedidos sempre chegam no prazo, a comida vem bem acondicionada e o atendimento é excepcional. Vale cada centavo!",
                "true_sentiment": "positive",
                "predicted_sentiment": "positive",
                "confidence": {
                    "negative": 0.03,
                    "neutral": 0.06,
                    "positive": 0.91
                },
                "correct": true
            }
        ];

        // Mapeamento de índices para nomes legíveis
        const labelNames = {
            'negative': 'Negativo',
            'neutral': 'Neutro',
            'positive': 'Positivo'
        };

        // Cores para cada sentimento
        const labelColors = {
            'negative': '#e74c3c',
            'neutral': '#f39c12',
            'positive': '#27ae60'
        };

        // Mostra os exemplos na sidebar
        function displayExamples() {
            const container = document.getElementById('examplesContainer');
            container.innerHTML = '';

            examples.forEach(example => {
                const labelName = labelNames[example.true_sentiment] || example.true_sentiment;
                const labelColor = labelColors[example.true_sentiment] || '#11998e';
                
                const card = document.createElement('div');
                card.className = 'example-card';
                card.innerHTML = `
                    <div class="example-label" style="color: ${labelColor};">
                        ${labelName} ${example.correct ? '✓' : '✗'}
                    </div>
                    <div class="example-text">${example.content}</div>
                `;
                card.onclick = () => {
                    document.getElementById('textInput').value = example.content;
                    analyzeText(example.content);
                };
                container.appendChild(card);
            });
        }

        // Carrega o modelo Random Forest
        async function loadModel() {
            const loading = document.getElementById('loading');
            const modelInfo = document.getElementById('modelInfo');
            loading.classList.add('show');
            
            try {
                const response = await fetch('./sentiment_random_forest.json');
                model = await response.json();
                console.log('✅ Modelo Random Forest carregado!');
                console.log(`📊 Vocabulário: ${model.vocabulary.length} termos`);
                console.log(`🌳 Árvores: ${model.n_estimators}`);
                console.log(`🏷️  Classes: ${model.classes.length}`);
                
                modelInfo.innerHTML = `
                    <strong>Modelo carregado!</strong><br>
                    🌳 ${model.n_estimators} árvores de decisão | 
                    📊 ${model.vocabulary.length} termos no vocabulário | 
                    🏷️ ${model.classes.length} classes
                `;
                
                loading.textContent = 'Modelo carregado! Digite um texto...';
                setTimeout(() => loading.classList.remove('show'), 2000);
            } catch (error) {
                console.error('❌ Erro ao carregar modelo:', error);
                loading.textContent = 'Erro ao carregar modelo!';
                modelInfo.innerHTML = '<strong style="color: #e74c3c;">❌ Erro ao carregar modelo!</strong>';
            }
        }
        
        // Mapeia as classes do modelo para os labels legíveis
        function mapClassToLabel(classValue) {
            // Adapta baseado na estrutura do modelo
            const mapping = {
                '0': 'negative',
                '1': 'neutral',
                '2': 'positive',
                'negative': 'negative',
                'neutral': 'neutral',
                'positive': 'positive'
            };
            return mapping[String(classValue)] || String(classValue);
        }

        // Tokeniza o texto
        function tokenize(text) {
            return text.toLowerCase()
                .replace(/[^\w\s]/g, ' ')
                .split(/\s+/)
                .filter(word => word.length > 0);
        }

        // Cria n-gramas
        function createNgrams(tokens, n) {
            const ngrams = [];
            for (let i = 0; i <= tokens.length - n; i++) {
                ngrams.push(tokens.slice(i, i + n).join(' '));
            }
            return ngrams;
        }

        // Calcula TF-IDF
        function calculateTFIDF(text, model) {
            const tokens = tokenize(text);
            const [minN, maxN] = model.ngram_range;
            
            // Gera todos os n-gramas no intervalo especificado
            let allNgrams = [];
            for (let n = minN; n <= maxN; n++) {
                if (n <= tokens.length) {
                    allNgrams = allNgrams.concat(createNgrams(tokens, n));
                }
            }
            
            // Conta frequência dos termos
            const termFreq = {};
            allNgrams.forEach(term => {
                termFreq[term] = (termFreq[term] || 0) + 1;
            });
            
            // Calcula TF-IDF para cada feature
            const features = new Array(model.vocabulary.length).fill(0);
            
            model.vocabulary.forEach((term, idx) => {
                if (termFreq[term]) {
                    const tf = termFreq[term] / allNgrams.length;
                    const idf = model.idf_values[idx];
                    features[idx] = tf * idf;
                }
            });
            
            return features;
        }

        // Prediz usando uma única árvore de decisão
        function predictTree(features, tree) {
            let nodeIdx = 0; // Começa na raiz
            
            while (tree.children_left[nodeIdx] !== -1 || tree.children_right[nodeIdx] !== -1) {
                const featureIdx = tree.feature[nodeIdx];
                const threshold = tree.threshold[nodeIdx];
                
                // Decide qual filho seguir
                if (features[featureIdx] <= threshold) {
                    nodeIdx = tree.children_left[nodeIdx];
                } else {
                    nodeIdx = tree.children_right[nodeIdx];
                }
                
                // Proteção contra loops infinitos
                if (nodeIdx === -1) break;
            }
            
            // Retorna as probabilidades do nó folha
            return tree.value[nodeIdx];
        }

        // Faz a predição usando Random Forest
        function predict(text, model) {
            const features = calculateTFIDF(text, model);
            
            // Agrega as predições de todas as árvores
            const numClasses = model.classes.length;
            const aggregatedProbs = new Array(numClasses).fill(0);
            
            // Executa cada árvore
            model.estimators.forEach(tree => {
                const treeProbs = predictTree(features, tree);
                treeProbs.forEach((prob, idx) => {
                    aggregatedProbs[idx] += prob;
                });
            });
            
            // Média das probabilidades (votação)
            const probabilities = aggregatedProbs.map(p => p / model.n_estimators);
            
            // Normaliza as probabilidades (para garantir que somem 1)
            const sumProbs = probabilities.reduce((a, b) => a + b, 0);
            const normalizedProbs = probabilities.map(p => p / sumProbs);
            
            // Encontra a classe predita
            const maxIdx = normalizedProbs.indexOf(Math.max(...normalizedProbs));
            const predictedClass = model.classes[maxIdx];
            const mappedLabel = mapClassToLabel(predictedClass);
            const sentiment = labelNames[mappedLabel] || mappedLabel;
            const confidence = normalizedProbs[maxIdx];
            
            return {
                sentiment,
                confidence,
                probabilities: normalizedProbs.map((prob, idx) => {
                    const classLabel = mapClassToLabel(model.classes[idx]);
                    return {
                        label: labelNames[classLabel] || classLabel,
                        probability: prob
                    };
                })
            };
        }

        // Mostra o resultado
        function showResult(result) {
            const resultDiv = document.getElementById('result');
            const sentimentDiv = document.getElementById('sentiment');
            const confidenceDiv = document.getElementById('confidence');
            const probabilitiesDiv = document.getElementById('probabilities');

            sentimentDiv.textContent = `Sentimento: ${result.sentiment}`;
            confidenceDiv.textContent = `Confiança: ${(result.confidence * 100).toFixed(2)}%`;

            // Mostra todas as probabilidades
            probabilitiesDiv.innerHTML = '<strong>Todas as probabilidades:</strong>';
            result.probabilities
                .sort((a, b) => b.probability - a.probability)
                .forEach(item => {
                    const percentage = (item.probability * 100).toFixed(2);
                    probabilitiesDiv.innerHTML += `
                        <div class="prob-item">
                            <span>${item.label}</span>
                            <span>${percentage}%</span>
                        </div>
                        <div class="prob-bar">
                            <div class="prob-fill" style="width: ${percentage}%"></div>
                        </div>
                    `;
                });

            resultDiv.classList.add('show');
        }

        // Analisa o texto
        function analyzeText(text) {
            if (!model) {
                alert('Modelo ainda não foi carregado!');
                return;
            }

            if (!text.trim()) {
                return;
            }

            console.log('📝 Analisando:', text);
            const startTime = performance.now();
            const result = predict(text, model);
            const endTime = performance.now();
            console.log(`🎯 Resultado: ${result.sentiment} (${(endTime - startTime).toFixed(2)}ms)`);
            console.log('📊 Probabilidades:', result.probabilities);
            
            showResult(result);
        }

        // Event listeners
        document.getElementById('textInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const text = e.target.value;
                analyzeText(text);
            }
        });

        document.getElementById('analyzeBtn').addEventListener('click', () => {
            const text = document.getElementById('textInput').value;
            analyzeText(text);
        });

        // Inicializa a página
        window.addEventListener('DOMContentLoaded', () => {
            displayExamples();
            loadModel();
        });
    </script>
</body>
</html>
